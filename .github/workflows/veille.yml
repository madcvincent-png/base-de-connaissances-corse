name: Veille RSS vers Notion

on:
  schedule:
    - cron: "17 * * * *"   # toutes les heures, à la 17e minute (heure UTC)
  workflow_dispatch:
    inputs:
      essai:
        description: "Essai : lire et trier sans rien écrire dans Notion"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: veille
  cancel-in-progress: false

jobs:
  veille:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r veille/requirements.txt
      - name: Tests hors ligne
        run: python -m unittest discover -s tests
      - name: Collecte
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python scripts/veille.py ${{ inputs.essai && '--essai' || '' }}

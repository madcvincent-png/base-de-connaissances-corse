name: Export Notion et reconstruction du site

# Lit les bases Notion avec le secret NOTION_TOKEN, reconstruit les données publiques
# et les pages, puis dépose le résultat sur la branche. L'export brut (prive/raw.json)
# reste dans l'exécuteur : il contient des données internes et n'est jamais versionné.
on:
  workflow_dispatch:
  schedule:
    - cron: "47 4 * * *"

permissions:
  contents: write

concurrency:
  group: export-notion
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
    steps:
      - name: Vérifier le jeton
        if: env.NOTION_TOKEN == ''
        run: echo "Secret NOTION_TOKEN absent : rien à exporter." && exit 0
      - uses: actions/checkout@v4
        if: env.NOTION_TOKEN != ''
        with:
          ref: refonte-base-connaissances
      - uses: actions/setup-python@v5
        if: env.NOTION_TOKEN != ''
        with:
          python-version: "3.12"
      - if: env.NOTION_TOKEN != ''
        run: pip install requests==2.32.3
      - name: Exporter Notion
        if: env.NOTION_TOKEN != ''
        run: python scripts/export_notion.py --sortie "$RUNNER_TEMP/raw.json"
      - name: Reconstruire (profil public seulement)
        if: env.NOTION_TOKEN != ''
        run: |
          python scripts/build_data.py --raw "$RUNNER_TEMP/raw.json" --profil public
          python scripts/build_pages.py
      - name: Déposer
        if: env.NOTION_TOKEN != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/kb.js data/kb.json *.html
          if git diff --cached --quiet; then echo "Rien de nouveau."; exit 0; fi
          git commit -m "Export Notion du $(date +%F)"
          git pull --rebase
          git push

name: Photos et logos (Wikimedia Commons)

# Tourne quand le script change sur la branche de refonte, ou à la demande.
# Les images et leurs crédits sont ensuite déposés sur la même branche.
on:
  push:
    branches: [refonte-base-connaissances]
    paths: [scripts/build_images.py, .github/workflows/images.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: images
  cancel-in-progress: true

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests==2.32.3 pillow==10.4.0
      - run: python scripts/build_images.py
      - name: Déposer les images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/img data/images.json data/images.js
          if git diff --cached --quiet; then echo "Aucune image nouvelle."; exit 0; fi
          git commit -m "Photos et logos depuis Wikimedia Commons"
          git push
